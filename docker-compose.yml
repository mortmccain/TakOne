# docker-compose.yml — TakOne stack
# SQL Server 2022 + ASP.NET 10 Blazor Server

name: takone

services:

  takone-db:
    # PINNED to a specific SQL Server 2022 CU tag (NOT :latest) for
    # data-safety. `:latest` could silently jump a major version on a
    # `docker compose pull`, and a SQL Server major-version upgrade is
    # a one-way door that may require a manual upgrade path. Pinning
    # ensures `git pull && docker compose up -d --build` only updates
    # the app, never the DB engine. Bump this tag deliberately (after
    # backing up) when you want to upgrade SQL Server.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: takone-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    # No `ports:` mapping — SQL Server must NOT be exposed to the host.
    # The web container reaches takone-db:1433 over the internal Docker
    # network. Exposing 1433 to the host combined with the SA password
    # (still echoed nowhere now that set -x is gone, but still present
    # in env) lets anyone with host access connect with full SA creds.
    # To inspect the DB, use: docker compose exec takone-db
    # /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_SA_PASSWORD" -C -Q '...'
    # See Brutal Code Review v3 finding #06.
    volumes:
      - takone_sqldata:/var/opt/mssql
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    labels:
      - org.opencontainers.image.title=TakOne Database
      - org.opencontainers.image.version=1.0.0

  takone-web:
    image: takone-web:1.0.0
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takone-web
    restart: unless-stopped
    depends_on:
      takone-db:
        condition: service_healthy
    environment:
      TakOne__Database__ConnectionString: "Server=takone-db,1433;Database=TakOne;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=False;"
      TAKONE_CONNECTION_STRING: "Server=takone-db,1433;Database=TakOne;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=False;"
      SQL_HOST: "takone-db"
      SQL_PORT: "1433"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"

      # Timezone — the dashboard greeting uses DateTime.Now.Hour
      # to pick "Good morning/afternoon/evening". Without this,
      # the container defaults to UTC and the greeting is wrong
      # for Iranian users (e.g. 15:00 Tehran = 11:30 UTC → "morning").
      TZ: "Asia/Tehran"
      # Uploads now live outside wwwroot (see the volume mount below) so
      # they are never served by the unauthenticated UseStaticFiles
      # middleware. See Brutal Code Review v3 finding #09.
      FileStorage__RootPath: "/var/lib/takone/uploads"
      TakOne__DefaultAdmin__Enabled: "true"
      TakOne__DefaultAdmin__WorkerId: "ADMIN-0001"
      TakOne__DefaultAdmin__Email: "admin@takone.local"
      TakOne__DefaultAdmin__Password: "${TAKONE_ADMIN_PASSWORD}"
      TakOne__DefaultAdmin__ForcePasswordChangeOnFirstLogin: "true"
    ports:
      - "8080:8080"
    # Uploads live OUTSIDE the app's wwwroot so they are not served by
    # the unauthenticated static-files middleware, and so the container
    # can run read-only. A dedicated minimal-API endpoint serves uploads
    # with authentication + Content-Disposition: attachment. See Brutal
    # Code Review v3 findings #09 + #10.
    volumes:
      - takone_uploads:/var/lib/takone/uploads
    # Container hardening (least privilege). `no-new-privileges` blocks
    # setuid escalation; `cap_drop: ALL` strips Linux capabilities;
    # `read_only` makes the rootfs immutable; tmpfs mounts give the few
    # directories that need write access a RAM-backed scratch space. The
    # uploads volume above is the only persistent writable path. See
    # Brutal Code Review v3 finding #10.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/.dotnet
    mem_limit: 1g
    healthcheck:
      # Hit the ASP.NET Core health endpoint (mapped via
      # MapHealthChecks("/health") in Program.cs) which itself runs an
      # AddDbContextCheck against SQL Server. A 200 means the DB is
      # reachable AND migrations are applied AND Kestrel is up — not
      # just "Kestrel is listening" (the old `curl /` returned 302 to
      # /Account/Login and passed even when the DB was down). See
      # Brutal Code Review v3 finding #11.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    labels:
      - org.opencontainers.image.title=TakOne WebUI
      - org.opencontainers.image.version=1.0.0

volumes:
  takone_sqldata:
  takone_uploads:
