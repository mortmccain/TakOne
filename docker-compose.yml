# =============================================================================
# docker-compose.yml — orchestrates the whole TakOne stack.
#
# This file defines TWO services:
#   1. sql  — Microsoft SQL Server 2022 (Linux edition, official image)
#   2. web  — the TakOne WebUI app (built from the Dockerfile in this repo)
#
# Plus TWO named volumes (persistent storage that survives container
# restarts and rebuilds):
#   1. sql_data   — SQL Server's data files (your actual database)
#   2. uploads    — product image uploads (so you don't lose them
#                   when you rebuild the app image)
#
# HOW TO USE (the short version — full guide in DEPLOYMENT.md):
#   1. Copy .env.example to .env and edit the passwords
#   2. `docker compose up -d --build`
#   3. Open http://YOUR-SERVER-IP:8080 in a browser
#
# WHY HTTP ONLY (no HTTPS):
#   HTTPS requires an SSL certificate. For your first deployment,
#   HTTP-only is fine. Once you have a domain name pointing at this
#   server, we can put Caddy or Nginx in front as a reverse proxy
#   that handles HTTPS automatically. One step at a time.
# =============================================================================

# Top-level services block.
services:

  # ---------- SQL Server ----------
  # Microsoft's official SQL Server 2022 Linux image. Free Developer
  # edition (full features, not for production use — but fine for
  # internal tooling and small deployments).
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: takone-sql
    restart: unless-stopped   # auto-restart on crash, but not if YOU stopped it
    environment:
      # SQL Server requires these two env vars:
      ACCEPT_EULA: "Y"                             # you accept the license
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env file}

      # PID controls which edition SQL Server runs as:
      #   Developer = full features, free, not for production
      #   Express   = free, limited to 10GB DB size, 1GB RAM
      # For 10-12GB server, Developer is fine.
      MSSQL_PID: "Developer"

      # Optional: change the default collation. The default
      # (SQL_Latin1_General_CP1_CI_AS) is fine for English. If you
      # have Persian/Arabic text sorting issues later, try
      # Persian_100_CI_AS here.
      # MSSQL_COLLATION: "Persian_100_CI_AS"
    ports:
      - "1433:1433"   # expose SQL Server on host port 1433 (optional —
                       # lets you connect with SSMS / Azure Data Studio
                       # from your laptop for debugging. Remove this
                       # line if you don't want external DB access.)
    volumes:
      - sql_data:/var/opt/mssql   # persistent DB storage
    # SQL Server 2022 needs at least 2GB RAM. On a 10-12GB server with
    # the app also running, set a memory limit so SQL Server doesn't
    # eat everything. 3GB is comfortable for a small internal app.
    mem_limit: 3g
    healthcheck:
      # This is what tells docker compose "the SQL container is ready
      # to accept connections." The web container's entrypoint still
      # has its own wait loop (defensive), but this lets us express
      # the dependency properly with `condition: service_healthy`.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------- TakOne WebUI ----------
  web:
    # Build the image from the Dockerfile in this directory.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: takone-web
    restart: unless-stopped
    depends_on:
      sql:
        condition: service_healthy   # don't start web until SQL is ready
    environment:
      # Override the connection string from appsettings.json.
      # The .NET config system reads env vars with __ as section separators,
      # so TakOne__Database__ConnectionString maps to TakOne:Database:ConnectionString.
      # The connection string here:
      #   - Server=sql              -> "sql" is the service name above; Docker's
      #                                internal DNS resolves it to the SQL container's IP
      #   - User Id=sa;Password=...  -> SQL Server auth (NOT Trusted_Connection, which
      #                                is Windows-only and won't work in Linux containers)
      #   - TrustServerCertificate=True -> SQL Server in the container uses a self-signed
      #                                cert; this tells the .NET driver to trust it
      #   - Encrypt=True             -> required by modern SQL Server drivers
      TakOne__Database__ConnectionString: "Server=sql,1433;Database=TakOne;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env file};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=False;"

      # Same connection string, used by docker-entrypoint.sh to run the
      # EF migrations bundle (which doesn't read .NET config).
      TAKONE_CONNECTION_STRING: "Server=sql,1433;Database=TakOne;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env file};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=False;"

      # Tells the entrypoint script where SQL Server is (for the wait loop).
      SQL_HOST: "sql"
      SQL_PORT: "1433"

      # ASP.NET Core env. Production turns on:
      #   - optimized razor views
      #   - appsettings.Production.json loading
      #   - less verbose logs
      ASPNETCORE_ENVIRONMENT: "Production"

      # Tell ASP.NET Core to listen on port 8080 inside the container.
      ASPNETCORE_HTTP_PORTS: "8080"

      # File storage root — where product image uploads land. We mount
      # a named volume on /app/wwwroot/uploads below, so files persist
      # across container rebuilds.
      FileStorage__RootPath: "/app/wwwroot/uploads"

      # Override the default admin seeder. appsettings.json has it
      # disabled — flip it on for production so you can log in.
      TakOne__Database__DefaultAdmin__Enabled: "true"
    ports:
      - "8080:8080"   # host port 8080 -> container port 8080.
                       # Open http://YOUR-SERVER-IP:8080 in a browser.
    volumes:
      - uploads:/app/wwwroot/uploads   # persistent uploads
    mem_limit: 1g   # the app itself doesn't need much
    # Wait 20s after starting before healthcheck kicks in — gives the
    # entrypoint time to apply migrations + boot ASP.NET.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ---------- Persistent volumes ----------
# These survive container restarts, rebuilds, and `docker compose down`.
# They only get deleted if you explicitly run `docker compose down -v`
# (the -v flag means "also delete volumes" — be careful with that one).
volumes:
  sql_data:
  uploads:
